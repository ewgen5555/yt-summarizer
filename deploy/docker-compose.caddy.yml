# Дополнение к docker-compose.yml: HTTPS через Caddy (сертификат Let's Encrypt автоматически).
# docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d
services:
  app:
    ports: !reset []
    expose:
      - "8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
