name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg and a speech synthesizer
        # espeak-ng нужен регрессионному тесту на пустой транскрипт (tests/test_transcribe_vad.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag yt-summarizer:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8000:8000 yt-summarizer:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
